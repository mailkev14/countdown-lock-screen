<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="c_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="40%" stop-color="#0a1228"/>
      <stop offset="80%" stop-color="#0e1b38"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>

    <radialGradient id="c_glowLeft" cx="25%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="c_glowRight" cx="75%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="c_brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="c_phoneFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="c_mockupShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="40" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: "SF Mono", "Roboto Mono", Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#c_bg)"/>
  <rect width="1600" height="900" fill="url(#c_glowLeft)"/>
  <rect width="1600" height="900" fill="url(#c_glowRight)"/>

  <!-- Tech Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1300" y1="0" x2="1300" y2="900"/>
    <line x1="1500" y1="0" x2="1500" y2="900"/>
    <line x1="0" y1="180" x2="1600" y2="180"/>
    <line x1="0" y1="360" x2="1600" y2="360"/>
    <line x1="0" y1="540" x2="1600" y2="540"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
  </g>

  <!-- ========================================== -->
  <!-- LEFT COLUMN: TITLE & CONTEST BADGES        -->
  <!-- ========================================== -->
  <g transform="translate(100, 110)">
    <!-- Partnership Badge -->
    <g>
      <rect width="440" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <circle cx="24" cy="21" r="6" fill="#38bdf8"/>
      <text x="42" y="27" class="font-sans" font-size="15" font-weight="600" fill="#93c5fd" letter-spacing="1.5">HANDSHAKE × GOOGLE CHALLENGE</text>
    </g>

    <!-- Main Project Title -->
    <text x="0" y="125" class="font-sans" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">HORIZON</text>
    <text x="0" y="185" class="font-sans" font-size="34" font-weight="700" fill="url(#c_brandGrad)" letter-spacing="-0.5">Reverse-Engineered Countdown Lock Screen</text>

    <!-- Project Subtitle / Narrative -->
    <text x="0" y="235" class="font-sans" font-size="20" font-weight="400" fill="#94a3b8">Turn overwhelming deadlines into an actionable Heads-Up Display.</text>
    <text x="0" y="265" class="font-sans" font-size="20" font-weight="400" fill="#94a3b8">Engineered for mobile safe zones with native milestone pacing &amp; sync.</text>

    <!-- Feature Grid Pills -->
    <g transform="translate(0, 320)">
      <!-- Pill 1 -->
      <g>
        <rect width="260" height="52" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4"/>
        <circle cx="28" cy="26" r="8" fill="#0284c7"/>
        <text x="48" y="32" class="font-sans" font-size="16" font-weight="700" fill="#f1f5f9">Reverse Milestone HUD</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(276, 0)">
        <rect width="270" height="52" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.4"/>
        <circle cx="28" cy="26" r="8" fill="#059669"/>
        <text x="48" y="32" class="font-sans" font-size="16" font-weight="700" fill="#f1f5f9">Safe-Zone Calibrated</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 68)">
        <rect width="260" height="52" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#a855f7" stroke-opacity="0.4"/>
        <circle cx="28" cy="26" r="8" fill="#7e22ce"/>
        <text x="48" y="32" class="font-sans" font-size="16" font-weight="700" fill="#f1f5f9">Phone &amp; Desktop Ready</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(276, 68)">
        <rect width="270" height="52" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#f59e0b" stroke-opacity="0.4"/>
        <circle cx="28" cy="26" r="8" fill="#d97706"/>
        <text x="48" y="32" class="font-sans" font-size="16" font-weight="700" fill="#f1f5f9">Google Calendar (.ics) Sync</text>
      </g>
    </g>

    <!-- Official Mission Citation -->
    <g transform="translate(0, 500)">
      <rect width="550" height="96" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="24" y="38" class="font-mono" font-size="14" font-weight="600" fill="#38bdf8" letter-spacing="1">PROJECT SUBMISSION REQUIREMENT CHECKLIST:</text>
      <text x="24" y="68" class="font-sans" font-size="16" font-weight="500" fill="#cbd5e1">✓ Title  •  ✓ Cover Image  •  ✓ Description  •  ✓ Live URL</text>
    </g>

    <text x="0" y="660" class="font-mono" font-size="15" font-weight="500" fill="#64748b">SUBMITTED TO HANDSHAKE AI SKILLS STUDIO • ENTRY DEADLINE NOV 23, 2026</text>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT: REALISTIC DEVICE MOCKUPS            -->
  <!-- ========================================== -->
  <!-- LAPTOP FRAME IN BACKGROUND -->
  <g transform="translate(900, 190)" filter="url(#c_mockupShadow)">
    <!-- Laptop Lid -->
    <rect width="620" height="390" rx="20" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <!-- Laptop Screen -->
    <rect x="18" y="18" width="584" height="354" rx="10" fill="#070b16"/>
    <!-- Screen content preview: desktop wallpaper scaled down -->
    <!-- Mini HUD card -->
    <rect x="36" y="36" width="180" height="318" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="50" y="66" class="font-sans" font-size="14" font-weight="800" fill="#ffffff">Dream Tech Offer</text>
    <circle cx="126" cy="140" r="44" fill="none" stroke="#38bdf8" stroke-width="8"/>
    <text x="126" y="146" class="font-mono" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">21D</text>
    <text x="126" y="215" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">ON TRACK (30%)</text>

    <!-- Mini Milestones on desktop screen -->
    <rect x="230" y="36" width="354" height="54" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
    <text x="246" y="68" class="font-sans" font-size="12" font-weight="700" fill="#34d399">✓ M-30: Resume &amp; Handshake Polish</text>

    <rect x="230" y="100" width="354" height="60" rx="8" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="246" y="136" class="font-sans" font-size="13" font-weight="800" fill="#ffffff">▶ M-21: 20 Applications &amp; Portfolio V1</text>

    <rect x="230" y="170" width="354" height="50" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="246" y="200" class="font-sans" font-size="12" font-weight="600" fill="#94a3b8">○ M-14: Technical &amp; Behavioral Mocks</text>

    <rect x="230" y="230" width="354" height="50" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="246" y="260" class="font-sans" font-size="12" font-weight="600" fill="#94a3b8">○ M-07: Final Round Onsite Interviews</text>

    <rect x="230" y="290" width="354" height="50" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="246" y="320" class="font-sans" font-size="12" font-weight="700" fill="#fbbf24">★ M-00: Offer Signed &amp; Celebrated</text>

    <!-- Laptop Base -->
    <path d="M-40 390 L660 390 L630 410 L-10 410 Z" fill="#334155"/>
    <rect x="250" y="392" width="120" height="8" rx="4" fill="#64748b"/>
  </g>

  <!-- PHONE FRAME IN FOREGROUND (ANGLED & CRISP) -->
  <g transform="translate(740, 100)" filter="url(#c_mockupShadow)">
    <!-- Phone Outer Body (Titanium Frame) -->
    <rect width="360" height="740" rx="54" fill="url(#c_phoneFrame)" stroke="#64748b" stroke-width="4"/>
    <rect x="10" y="10" width="340" height="720" rx="46" fill="#020617"/>

    <!-- Screen Glass Area -->
    <rect x="12" y="12" width="336" height="716" rx="44" fill="#080e1e"/>

    <!-- Phone Dynamic Island -->
    <rect x="120" y="22" width="120" height="30" rx="15" fill="#000000"/>
    <circle cx="218" cy="37" r="5" fill="#0f172a"/>

    <!-- Phone Lock Screen Native Clock (In Safe Zone!) -->
    <g transform="translate(180, 115)">
      <text x="0" y="0" class="font-sans" font-size="15" font-weight="500" fill="#e2e8f0" text-anchor="middle">Monday, November 16</text>
      <text x="0" y="66" class="font-sans" font-size="70" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">09:41</text>
    </g>

    <!-- HORIZON COUNTDOWN CARD ON PHONE -->
    <g transform="translate(28, 205)">
      <rect width="304" height="120" rx="18" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="14" y="12" width="105" height="18" rx="9" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="66" y="25" class="font-sans" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">HANDSHAKE SPRINT</text>
      <text x="290" y="25" class="font-mono" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="end">DEC 16</text>
      <text x="14" y="48" class="font-sans" font-size="14" font-weight="800" fill="#ffffff">Dream Tech Offer</text>

      <!-- Mini digit counters -->
      <g transform="translate(14, 58)">
        <rect width="52" height="34" rx="8" fill="#1e293b"/>
        <text x="26" y="23" class="font-mono" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">21</text>
        <text x="26" y="44" class="font-sans" font-size="7" font-weight="700" fill="#64748b" text-anchor="middle">DAYS</text>

        <rect x="58" width="52" height="34" rx="8" fill="#1e293b"/>
        <text x="84" y="23" class="font-mono" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">14</text>
        <text x="84" y="44" class="font-sans" font-size="7" font-weight="700" fill="#64748b" text-anchor="middle">HOURS</text>

        <rect x="116" width="52" height="34" rx="8" fill="#1e293b"/>
        <text x="142" y="23" class="font-mono" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">38</text>
        <text x="142" y="44" class="font-sans" font-size="7" font-weight="700" fill="#64748b" text-anchor="middle">MINS</text>
      </g>

      <!-- Mini Ring -->
      <circle cx="245" cy="74" r="24" fill="none" stroke="#1e293b" stroke-width="6"/>
      <circle cx="245" cy="74" r="24" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-dasharray="45 150" transform="rotate(-90 245 74)"/>
      <text x="245" y="78" class="font-mono" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">30%</text>
    </g>

    <!-- HORIZON MILESTONES ON PHONE -->
    <g transform="translate(28, 335)">
      <!-- M1: Done -->
      <g>
        <rect width="304" height="48" rx="12" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
        <circle cx="22" cy="24" r="10" fill="#059669"/>
        <path d="M18 24 L21 27 L26 21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <text x="40" y="22" class="font-mono" font-size="9" font-weight="700" fill="#34d399">M-30 • DONE</text>
        <text x="40" y="36" class="font-sans" font-size="11" font-weight="700" fill="#e2e8f0">Resume &amp; Profile Audit</text>
      </g>

      <!-- M2: Active Focus -->
      <g transform="translate(0, 56)">
        <rect width="304" height="60" rx="14" fill="#0369a1" fill-opacity="0.45" stroke="#38bdf8" stroke-width="1.8"/>
        <circle cx="22" cy="30" r="11" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
        <text x="40" y="24" class="font-mono" font-size="9" font-weight="800" fill="#38bdf8">▶ ACTIVE (7D LEFT)</text>
        <text x="40" y="42" class="font-sans" font-size="12" font-weight="800" fill="#ffffff">20 Applications &amp; Portfolio</text>
      </g>

      <!-- M3: Upcoming -->
      <g transform="translate(0, 124)">
        <rect width="304" height="46" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1"/>
        <circle cx="22" cy="23" r="8" fill="#334155"/>
        <text x="40" y="20" class="font-mono" font-size="8" font-weight="600" fill="#64748b">M-14 • NOV 30</text>
        <text x="40" y="34" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">Coding &amp; Behavioral Mocks</text>
      </g>

      <!-- M4: Upcoming -->
      <g transform="translate(0, 178)">
        <rect width="304" height="46" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1"/>
        <circle cx="22" cy="23" r="8" fill="#334155"/>
        <text x="40" y="20" class="font-mono" font-size="8" font-weight="600" fill="#64748b">M-07 • DEC 07</text>
        <text x="40" y="34" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">Final Round Onsite Interviews</text>
      </g>

      <!-- M5: Goal -->
      <g transform="translate(0, 232)">
        <rect width="304" height="48" rx="12" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
        <circle cx="22" cy="24" r="10" fill="#b45309"/>
        <polygon points="22,17 24,22 29,22 25,25 27,30 22,27 17,30 19,25 15,22 20,22" fill="#fbbf24"/>
        <text x="40" y="22" class="font-mono" font-size="9" font-weight="700" fill="#fbbf24">M-00 • VICTORY</text>
        <text x="40" y="37" class="font-sans" font-size="11" font-weight="700" fill="#ffffff">Dream Offer Negotiated &amp; Signed</text>
      </g>
    </g>

    <!-- Phone Lock Screen Bottom Controls (Flashlight / Camera / Bar) -->
    <g transform="translate(48, 660)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" fill-opacity="0.18"/>
      <!-- Flashlight icon -->
      <path d="M-6 -8 L6 -8 L3 1 L3 8 L-3 8 L-3 1 Z" fill="#ffffff"/>
      <circle cx="264" cy="0" r="22" fill="#ffffff" fill-opacity="0.18"/>
      <!-- Camera icon -->
      <rect x="254" y="-7" width="20" height="14" rx="3" fill="#ffffff"/>
      <circle cx="264" cy="0" r="4" fill="#0f172a"/>
    </g>
    <!-- Home Bar -->
    <rect x="110" y="710" width="140" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.8"/>
  </g>
</svg>
