<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sc_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="50%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>

    <linearGradient id="v1_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="v2_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="sc_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="5" stdDeviation="15" flood-color="#38bdf8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    .serif { font-family: "Georgia", "Baskerville", "Times New Roman", serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "SF Mono", "Courier New", monospace; }
  </style>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#sc_bg)"/>

  <!-- Divider Line -->
  <line x1="800" y1="180" x2="800" y2="820" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- Header Banner -->
  <g transform="translate(100, 60)">
    <rect width="360" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="20" cy="18" r="5" fill="#38bdf8"/>
    <text x="36" y="23" class="sans" font-size="14" font-weight="600" fill="#93c5fd" letter-spacing="1.5">HANDSHAKE × GOOGLE CHALLENGE</text>

    <text x="0" y="80" class="sans" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">COUNTDOWN LOCK SCREEN STUDIO</text>
    <text x="0" y="112" class="sans" font-size="18" font-weight="400" fill="#94a3b8">Two Award-Caliber Editions Engineered for Device Safe Zones &amp; Calendar Pacing</text>
  </g>

  <!-- ========================================== -->
  <!-- LEFT: VERSION 1 (HORIZON - GLASSMORPHIC)   -->
  <!-- ========================================== -->
  <g transform="translate(100, 220)">
    <!-- Edition Card -->
    <rect width="660" height="600" rx="28" fill="#0d1424" fill-opacity="0.6" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Badge -->
    <rect x="36" y="36" width="180" height="34" rx="17" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="126" y="58" class="mono" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">VERSION 1.0 • HUD</text>

    <text x="36" y="110" class="sans" font-size="32" font-weight="800" fill="#ffffff">Horizon Edition</text>
    <text x="36" y="136" class="sans" font-size="16" font-weight="400" fill="#94a3b8">Glassmorphic Tech Career Offer Sprint</text>

    <!-- Mini Phone Frame -->
    <g transform="translate(36, 170)" filter="url(#sc_shadow)">
      <rect width="250" height="380" rx="36" fill="#0b1120" stroke="#334155" stroke-width="3"/>
      <!-- Island -->
      <rect x="85" y="14" width="80" height="18" rx="9" fill="#000"/>
      <!-- Clock Safe Zone -->
      <text x="125" y="70" class="sans" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">09:41</text>
      <!-- Card -->
      <rect x="18" y="90" width="214" height="90" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1"/>
      <text x="28" y="114" class="sans" font-size="10" font-weight="700" fill="#38bdf8">HANDSHAKE SPRINT</text>
      <text x="28" y="134" class="sans" font-size="12" font-weight="800" fill="#ffffff">Dream Tech Offer</text>
      <text x="28" y="162" class="mono" font-size="20" font-weight="800" fill="#ffffff">21D <tspan font-size="12" fill="#94a3b8">14H 38M</tspan></text>
      <!-- Milestones -->
      <rect x="18" y="195" width="214" height="38" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
      <text x="28" y="218" class="mono" font-size="9" font-weight="700" fill="#34d399">✓ M-30: Resume Audit</text>
      <rect x="18" y="242" width="214" height="42" rx="8" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="28" y="267" class="sans" font-size="10" font-weight="800" fill="#ffffff">▶ M-21: 20 Applications</text>
      <rect x="18" y="294" width="214" height="34" rx="8" fill="#1e293b" fill-opacity="0.4"/>
      <text x="28" y="315" class="sans" font-size="9" fill="#94a3b8">○ M-14: Coding Mocks</text>
    </g>

    <!-- Key Features List -->
    <g transform="translate(315, 200)">
      <text x="0" y="20" class="sans" font-size="16" font-weight="700" fill="#ffffff">Highlights:</text>
      <text x="0" y="55" class="sans" font-size="14" fill="#cbd5e1">• Circular Pacing Ring</text>
      <text x="0" y="85" class="sans" font-size="14" fill="#cbd5e1">• 4 Cyber-Color Palettes</text>
      <text x="0" y="115" class="sans" font-size="14" fill="#cbd5e1">• Tech Job Hunt Presets</text>
      <text x="0" y="145" class="sans" font-size="14" fill="#cbd5e1">• Dynamic Island Overlay</text>
      <text x="0" y="175" class="sans" font-size="14" fill="#cbd5e1">• Google Calendar Sync</text>
      <rect x="0" y="220" width="260" height="38" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="130" y="244" class="mono" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle">SUBMISSION 1 READY</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT: VERSION 2 (CHRONOS - SWISS EDITORIAL)-->
  <!-- ========================================== -->
  <g transform="translate(840, 220)">
    <rect width="660" height="600" rx="28" fill="#111215" fill-opacity="0.8" stroke="#27272a" stroke-width="1.5"/>

    <rect x="36" y="36" width="200" height="34" rx="17" fill="#451a03" fill-opacity="0.3" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="136" y="58" class="mono" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">VERSION 2.0 • EDITORIAL</text>

    <text x="36" y="110" class="serif" font-size="34" font-weight="400" fill="#f4f4f5">Chronos Edition</text>
    <text x="36" y="136" class="sans" font-size="16" font-weight="300" fill="#a1a1aa">Swiss Minimalist Thesis &amp; Capstone Engine</text>

    <!-- Mini Phone Frame -->
    <g transform="translate(36, 170)" filter="url(#sc_shadow)">
      <rect width="250" height="380" rx="36" fill="#0c0d10" stroke="#3f3f46" stroke-width="3"/>
      <rect x="85" y="14" width="80" height="18" rx="9" fill="#000"/>
      <text x="125" y="70" class="sans" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">09:41</text>
      <!-- Editorial Card -->
      <rect x="18" y="90" width="214" height="90" fill="#14161a" stroke="#27272a"/>
      <text x="28" y="110" class="mono" font-size="9" font-weight="700" fill="#d97706">PROJECT NO. 01</text>
      <text x="28" y="130" class="serif" font-size="12" fill="#ffffff">Thesis &amp; Degree</text>
      <text x="28" y="162" class="serif" font-size="24" fill="#ffffff">32 <tspan font-size="11" font-family="'SF Mono'">DAYS LEFT</tspan></text>
      <!-- Milestones -->
      <rect x="18" y="195" width="214" height="38" fill="#14161a" stroke="#27272a"/>
      <text x="28" y="218" class="serif" font-size="11" fill="#10b981">I. Scope &amp; Freeze [Done]</text>
      <rect x="18" y="242" width="214" height="42" fill="#1c1914" stroke="#d97706" stroke-width="1.2"/>
      <text x="28" y="267" class="serif" font-size="11" font-weight="600" fill="#f59e0b">II. Manuscript Draft [Active]</text>
      <rect x="18" y="294" width="214" height="34" fill="#121316" stroke="#27272a"/>
      <text x="28" y="315" class="serif" font-size="10" fill="#71717a">III. Faculty Revisions</text>
    </g>

    <!-- Key Features List -->
    <g transform="translate(315, 200)">
      <text x="0" y="20" class="sans" font-size="16" font-weight="700" fill="#ffffff">Highlights:</text>
      <text x="0" y="55" class="sans" font-size="14" fill="#cbd5e1">• Roman Numeral Milestones</text>
      <text x="0" y="85" class="sans" font-size="14" fill="#cbd5e1">• Dark Obsidian &amp; Light Ivory</text>
      <text x="0" y="115" class="sans" font-size="14" fill="#cbd5e1">• Senior Capstone Presets</text>
      <text x="0" y="145" class="sans" font-size="14" fill="#cbd5e1">• Swiss Hairline Progress Bar</text>
      <text x="0" y="175" class="sans" font-size="14" fill="#cbd5e1">• Academic .ics Calendar Sync</text>
      <rect x="0" y="220" width="260" height="38" rx="10" fill="#181512" stroke="#d97706" stroke-opacity="0.4"/>
      <text x="130" y="244" class="mono" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">SUBMISSION 2 READY</text>
    </g>
  </g>
</svg>
