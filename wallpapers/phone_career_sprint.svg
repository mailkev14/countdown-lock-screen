<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1179 2556" width="1179" height="2556">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="25%" stop-color="#0d1127"/>
      <stop offset="55%" stop-color="#0a192f"/>
      <stop offset="85%" stop-color="#081021"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <radialGradient id="topGlow" cx="50%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#065f46" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bottomGlow" cx="50%" cy="88%" r="35%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="activeNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: "SF Mono", "Roboto Mono", Menlo, monospace; }
  </style>

  <!-- Background Layer -->
  <rect width="1179" height="2556" fill="url(#bgGrad)"/>
  <rect width="1179" height="2556" fill="url(#topGlow)"/>
  <rect width="1179" height="2556" fill="url(#centerGlow)"/>
  <rect width="1179" height="2556" fill="url(#bottomGlow)"/>

  <!-- Subtle Ambient Tech Grid / Constellation -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <circle cx="140" cy="380" r="2" fill="#fff"/>
    <circle cx="980" cy="290" r="1.5" fill="#fff"/>
    <circle cx="1060" cy="740" r="2.5" fill="#fff"/>
    <circle cx="90" cy="1120" r="1.5" fill="#fff"/>
    <circle cx="1090" cy="1840" r="2" fill="#fff"/>
    <circle cx="120" cy="2180" r="2" fill="#fff"/>
    <line x1="80" y1="620" x2="1099" y2="620" stroke-dasharray="4 12" stroke-opacity="0.4"/>
  </g>

  <!-- ========================================== -->
  <!-- TOP SAFE ZONE (y: 0 to 600)               -->
  <!-- Intentionally left clean for iOS/Android  -->
  <!-- lock screen clock, date & battery icons!   -->
  <!-- ========================================== -->

  <!-- ========================================== -->
  <!-- HERO COUNTDOWN HUD (y: 640 to 1060)        -->
  <!-- ========================================== -->
  <g transform="translate(75, 640)" filter="url(#cardShadow)">
    <!-- Card Frame -->
    <rect width="1029" height="400" rx="36" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5"/>

    <!-- Category Pill -->
    <rect x="44" y="40" width="220" height="42" rx="21" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3"/>
    <circle cx="64" cy="61" r="5" fill="#38bdf8"/>
    <text x="80" y="67" class="font-sans" font-size="20" font-weight="600" fill="#7dd3fc" letter-spacing="1.5">HANDSHAKE SPRINT</text>

    <!-- Target Date Tag -->
    <text x="985" y="68" class="font-mono" font-size="22" font-weight="500" fill="#94a3b8" text-anchor="end">DEC 16, 2026</text>

    <!-- Main Deadline Title -->
    <text x="44" y="132" class="font-sans" font-size="44" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Dream Tech Offer Signed</text>
    <text x="44" y="168" class="font-sans" font-size="23" font-weight="400" fill="#94a3b8">Reverse-Engineered 30-Day Action Roadmap</text>

    <!-- Large Countdown Digits -->
    <g transform="translate(44, 210)">
      <!-- Days Block -->
      <g>
        <rect width="180" height="96" rx="20" fill="#0f172a" fill-opacity="0.7" stroke="#38bdf8" stroke-opacity="0.3"/>
        <text x="90" y="66" class="font-mono" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle">21</text>
        <text x="90" y="125" class="font-sans" font-size="18" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">DAYS</text>
      </g>
      <!-- Hours Block -->
      <g transform="translate(202, 0)">
        <rect width="180" height="96" rx="20" fill="#0f172a" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="90" y="66" class="font-mono" font-size="52" font-weight="800" fill="#e2e8f0" text-anchor="middle">14</text>
        <text x="90" y="125" class="font-sans" font-size="18" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">HOURS</text>
      </g>
      <!-- Mins Block -->
      <g transform="translate(404, 0)">
        <rect width="180" height="96" rx="20" fill="#0f172a" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="90" y="66" class="font-mono" font-size="52" font-weight="800" fill="#cbd5e1" text-anchor="middle">38</text>
        <text x="90" y="125" class="font-sans" font-size="18" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">MINS</text>
      </g>
      <!-- Circular Progress Indicator -->
      <g transform="translate(775, 48)">
        <circle cx="0" cy="0" r="54" fill="none" stroke="#1e293b" stroke-width="12"/>
        <!-- 30% Elapsed progress stroke (dasharray = 339, 30% = 102) -->
        <circle cx="0" cy="0" r="54" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="102 339" transform="rotate(-90)"/>
        <text x="0" y="8" class="font-mono" font-size="28" font-weight="800" fill="#38bdf8" text-anchor="middle">30%</text>
        <text x="0" y="80" class="font-sans" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="1.5">PACING</text>
      </g>
    </g>

    <!-- Linear Progress Accent Line -->
    <rect x="0" y="394" width="310" height="6" rx="3" fill="url(#accentGrad)"/>
  </g>

  <!-- ========================================== -->
  <!-- MILESTONE TIMELINE (y: 1100 to 2160)       -->
  <!-- ========================================== -->
  <g transform="translate(75, 1100)">
    <!-- Section Header -->
    <text x="12" y="32" class="font-sans" font-size="24" font-weight="700" fill="#f8fafc" letter-spacing="2">MILESTONE SPRINT</text>
    <text x="1017" y="32" class="font-mono" font-size="20" font-weight="500" fill="#38bdf8" text-anchor="end">MILESTONE 2 OF 5 ACTIVE</text>

    <!-- Central Connecting Timeline Line -->
    <line x1="68" y1="90" x2="68" y2="920" stroke="#1e293b" stroke-width="4"/>
    <line x1="68" y1="90" x2="68" y2="340" stroke="#38bdf8" stroke-width="4"/>

    <!-- MILESTONE 1 (COMPLETED) -->
    <g transform="translate(0, 70)">
      <!-- Card Container -->
      <rect x="128" y="0" width="901" height="150" rx="26" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2"/>
      <!-- Node Circle -->
      <circle cx="68" cy="75" r="26" fill="#064e3b" stroke="#10b981" stroke-width="3"/>
      <path d="M59 75 L66 82 L78 68" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Content -->
      <text x="164" y="52" class="font-mono" font-size="20" font-weight="700" fill="#34d399" letter-spacing="1">M-30 • COMPLETED</text>
      <text x="990" y="52" class="font-mono" font-size="19" font-weight="500" fill="#64748b" text-anchor="end">NOV 16</text>
      <text x="164" y="94" class="font-sans" font-size="29" font-weight="700" fill="#f1f5f9">Handshake Profile &amp; Resume Overhaul</text>
      <text x="164" y="126" class="font-sans" font-size="21" font-weight="400" fill="#94a3b8">Keywords tuned for ATS, headline polished, 3 projects linked</text>
    </g>

    <!-- MILESTONE 2 (IN PROGRESS - CURRENT FOCUS) -->
    <g transform="translate(0, 250)">
      <!-- Card Container (Highlighted) -->
      <rect x="128" y="0" width="901" height="168" rx="26" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="2.5" filter="url(#subtleGlow)"/>
      <rect x="128" y="0" width="901" height="168" rx="26" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <!-- Node Circle (Active Pulse) -->
      <circle cx="68" cy="84" r="30" fill="#0369a1" stroke="#38bdf8" stroke-width="4"/>
      <circle cx="68" cy="84" r="10" fill="#ffffff"/>
      <!-- Content -->
      <rect x="164" y="26" width="168" height="34" rx="17" fill="#0284c7" fill-opacity="0.25"/>
      <text x="248" y="49" class="font-mono" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">▶ ACTIVE NOW</text>
      <text x="990" y="52" class="font-mono" font-size="20" font-weight="600" fill="#38bdf8" text-anchor="end">NOV 23 (7D LEFT)</text>
      <text x="164" y="104" class="font-sans" font-size="31" font-weight="800" fill="#ffffff">20 Tailored Applications &amp; Portfolio V1</text>
      <text x="164" y="140" class="font-sans" font-size="22" font-weight="400" fill="#cbd5e1">Submit through Handshake, outreach to 5 alumni for referrals</text>
    </g>

    <!-- MILESTONE 3 (UPCOMING) -->
    <g transform="translate(0, 448)">
      <rect x="128" y="0" width="901" height="150" rx="26" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2"/>
      <circle cx="68" cy="75" r="22" fill="#0b1120" stroke="#475569" stroke-width="3"/>
      <circle cx="68" cy="75" r="6" fill="#64748b"/>
      <text x="164" y="52" class="font-mono" font-size="20" font-weight="600" fill="#64748b" letter-spacing="1">M-14 • UPCOMING</text>
      <text x="990" y="52" class="font-mono" font-size="19" font-weight="500" fill="#64748b" text-anchor="end">NOV 30</text>
      <text x="164" y="94" class="font-sans" font-size="29" font-weight="600" fill="#cbd5e1">Technical Coding &amp; Behavioral Mocks</text>
      <text x="164" y="126" class="font-sans" font-size="21" font-weight="400" fill="#64748b">10 LeetCode mediums, STAR method practice for top 8 stories</text>
    </g>

    <!-- MILESTONE 4 (UPCOMING) -->
    <g transform="translate(0, 628)">
      <rect x="128" y="0" width="901" height="150" rx="26" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2"/>
      <circle cx="68" cy="75" r="22" fill="#0b1120" stroke="#475569" stroke-width="3"/>
      <circle cx="68" cy="75" r="6" fill="#64748b"/>
      <text x="164" y="52" class="font-mono" font-size="20" font-weight="600" fill="#64748b" letter-spacing="1">M-07 • UPCOMING</text>
      <text x="990" y="52" class="font-mono" font-size="19" font-weight="500" fill="#64748b" text-anchor="end">DEC 07</text>
      <text x="164" y="94" class="font-sans" font-size="29" font-weight="600" fill="#cbd5e1">Final Round Onsite Interviews</text>
      <text x="164" y="126" class="font-sans" font-size="21" font-weight="400" fill="#64748b">System design review, executive panel, thank-you notes sent</text>
    </g>

    <!-- MILESTONE 5 (GOAL LINE) -->
    <g transform="translate(0, 808)">
      <rect x="128" y="0" width="901" height="150" rx="26" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="68" cy="75" r="26" fill="#451a03" stroke="#f59e0b" stroke-width="3.5"/>
      <!-- Star icon -->
      <polygon points="68,60 72,70 82,71 74,78 77,88 68,82 59,88 62,78 54,71 64,70" fill="#fbbf24"/>
      <text x="164" y="52" class="font-mono" font-size="20" font-weight="700" fill="#fbbf24" letter-spacing="1">M-00 • VICTORY</text>
      <text x="990" y="52" class="font-mono" font-size="19" font-weight="600" fill="#fbbf24" text-anchor="end">DEC 16</text>
      <text x="164" y="94" class="font-sans" font-size="29" font-weight="700" fill="#f8fafc">Offer Letter Negotiated &amp; Accepted</text>
      <text x="164" y="126" class="font-sans" font-size="21" font-weight="400" fill="#94a3b8">Compensation benchmarked, start date confirmed, celebrate!</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- MOTIVATIONAL MANTRA (y: 2180 to 2260)     -->
  <!-- ========================================== -->
  <g transform="translate(589, 2220)">
    <text x="0" y="0" class="font-sans" font-size="22" font-style="italic" font-weight="400" fill="#94a3b8" text-anchor="middle">“Focus only on the milestone in front of you. The deadline takes care of itself.”</text>
    <text x="0" y="32" class="font-mono" font-size="17" font-weight="500" fill="#475569" text-anchor="middle" letter-spacing="2">BUILT WITH GOOGLE AI SKILLS STUDIO × HANDSHAKE</text>
  </g>

  <!-- ========================================== -->
  <!-- BOTTOM SAFE ZONE (y: 2280 to 2556)         -->
  <!-- Intentionally clean for iPhone Flashlight,  -->
  <!-- Camera button & Home swipe bar!            -->
  <!-- ========================================== -->
</svg>
