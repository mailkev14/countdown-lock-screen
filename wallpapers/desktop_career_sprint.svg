<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2880 1800" width="2880" height="1800">
  <defs>
    <linearGradient id="d_bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="35%" stop-color="#091124"/>
      <stop offset="70%" stop-color="#0b1736"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <radialGradient id="d_leftGlow" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="d_rightGlow" cx="80%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="d_cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="d_cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="d_accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="d_cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: "SF Mono", "Roboto Mono", Menlo, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="2880" height="1800" fill="url(#d_bgGrad)"/>
  <rect width="2880" height="1800" fill="url(#d_leftGlow)"/>
  <rect width="2880" height="1800" fill="url(#d_rightGlow)"/>

  <!-- Subtle Ambient Constellation Grid -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <circle cx="280" cy="240" r="3" fill="#fff"/>
    <circle cx="1440" cy="180" r="2" fill="#fff"/>
    <circle cx="2600" cy="300" r="3" fill="#fff"/>
    <circle cx="2400" cy="1400" r="2.5" fill="#fff"/>
    <circle cx="480" cy="1550" r="3" fill="#fff"/>
    <line x1="200" y1="900" x2="2680" y2="900" stroke-dasharray="8 24" stroke-opacity="0.3"/>
  </g>

  <!-- ========================================== -->
  <!-- TOP SAFE ZONE: Clear for macOS Menu Bar   -->
  <!-- ========================================== -->

  <!-- ========================================== -->
  <!-- LEFT COLUMN: COUNTDOWN HUD (x: 160, y: 220)-->
  <!-- ========================================== -->
  <g transform="translate(160, 220)" filter="url(#d_cardShadow)">
    <rect width="900" height="1360" rx="40" fill="url(#d_cardGrad)" stroke="url(#d_cardBorder)" stroke-width="2"/>

    <!-- Category Pill -->
    <rect x="64" y="64" width="260" height="48" rx="24" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3"/>
    <circle cx="88" cy="88" r="6" fill="#38bdf8"/>
    <text x="110" y="95" class="font-sans" font-size="22" font-weight="600" fill="#7dd3fc" letter-spacing="2">CAREER MISSION</text>

    <!-- Main Title -->
    <text x="64" y="180" class="font-sans" font-size="54" font-weight="800" fill="#f8fafc" letter-spacing="-1">Dream Tech Offer</text>
    <text x="64" y="226" class="font-sans" font-size="26" font-weight="400" fill="#94a3b8">30-Day Reverse-Engineered Sprint</text>

    <!-- Circular Progress Graphic -->
    <g transform="translate(450, 470)">
      <circle cx="0" cy="0" r="160" fill="none" stroke="#1e293b" stroke-width="26"/>
      <!-- Perimeter = 2 * pi * 160 = 1005. 30% = 301 -->
      <circle cx="0" cy="0" r="160" fill="none" stroke="url(#d_accentGrad)" stroke-width="26" stroke-linecap="round" stroke-dasharray="301 1005" transform="rotate(-90)"/>
      <text x="0" y="24" class="font-mono" font-size="78" font-weight="800" fill="#ffffff" text-anchor="middle">21</text>
      <text x="0" y="80" class="font-sans" font-size="24" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="3">DAYS LEFT</text>
    </g>

    <!-- Stat Grid -->
    <g transform="translate(64, 730)">
      <rect width="360" height="130" rx="24" fill="#0f172a" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="40" y="52" class="font-sans" font-size="20" font-weight="600" fill="#64748b" letter-spacing="1">TARGET DATE</text>
      <text x="40" y="96" class="font-mono" font-size="34" font-weight="700" fill="#e2e8f0">DEC 16, 2026</text>

      <g transform="translate(412, 0)">
        <rect width="360" height="130" rx="24" fill="#0f172a" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.3"/>
        <text x="40" y="52" class="font-sans" font-size="20" font-weight="600" fill="#38bdf8" letter-spacing="1">PACING</text>
        <text x="40" y="96" class="font-mono" font-size="34" font-weight="700" fill="#38bdf8">ON TRACK (30%)</text>
      </g>
    </g>

    <!-- Hours & Minutes Block -->
    <g transform="translate(64, 900)">
      <rect width="772" height="120" rx="24" fill="#0f172a" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="40" y="70" class="font-mono" font-size="32" font-weight="600" fill="#94a3b8">EXACT T-MINUS:</text>
      <text x="340" y="72" class="font-mono" font-size="40" font-weight="800" fill="#38bdf8">21D : 14H : 38M</text>
    </g>

    <!-- Quote Box -->
    <g transform="translate(64, 1070)">
      <rect width="772" height="180" rx="24" fill="#1e293b" fill-opacity="0.3" stroke="#3b82f6" stroke-opacity="0.2"/>
      <text x="44" y="60" class="font-sans" font-size="24" font-style="italic" font-weight="400" fill="#cbd5e1">“Focus only on the milestone in front of you.</text>
      <text x="44" y="96" class="font-sans" font-size="24" font-style="italic" font-weight="400" fill="#cbd5e1">The deadline will take care of itself.”</text>
      <text x="44" y="142" class="font-mono" font-size="18" font-weight="600" fill="#64748b" letter-spacing="1">GOOGLE AI SKILLS STUDIO × HANDSHAKE</text>
    </g>

    <rect x="0" y="1350" width="300" height="10" rx="5" fill="url(#d_accentGrad)"/>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT COLUMN: MILESTONE ROADMAP            -->
  <!-- ========================================== -->
  <g transform="translate(1120, 220)" filter="url(#d_cardShadow)">
    <rect width="1600" height="1360" rx="40" fill="url(#d_cardGrad)" stroke="url(#d_cardBorder)" stroke-width="2"/>

    <!-- Header -->
    <text x="70" y="86" class="font-sans" font-size="38" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Reverse-Engineered Milestone Roadmap</text>
    <text x="70" y="124" class="font-sans" font-size="22" font-weight="400" fill="#94a3b8">Working backward from December 16 offer acceptance date</text>

    <!-- Milestone 1: Done -->
    <g transform="translate(70, 180)">
      <rect width="1460" height="190" rx="28" fill="#0f172a" fill-opacity="0.7" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="80" cy="95" r="34" fill="#064e3b" stroke="#10b981" stroke-width="3"/>
      <path d="M68 95 L76 103 L92 85" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="146" y="68" class="font-mono" font-size="22" font-weight="700" fill="#34d399" letter-spacing="1.5">M-30 • COMPLETED</text>
      <text x="1390" y="68" class="font-mono" font-size="22" font-weight="600" fill="#64748b" text-anchor="end">NOV 16</text>
      <text x="146" y="116" class="font-sans" font-size="34" font-weight="700" fill="#f8fafc">Handshake Profile &amp; Resume Overhaul</text>
      <text x="146" y="154" class="font-sans" font-size="24" font-weight="400" fill="#94a3b8">Targeted keywords optimized for ATS, recruiter headline polished, top 3 projects linked</text>
    </g>

    <!-- Milestone 2: Active -->
    <g transform="translate(70, 400)">
      <rect width="1460" height="210" rx="28" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="80" cy="105" r="38" fill="#0369a1" stroke="#38bdf8" stroke-width="4"/>
      <circle cx="80" cy="105" r="14" fill="#ffffff"/>
      <rect x="146" y="38" width="180" height="38" rx="19" fill="#0284c7" fill-opacity="0.3"/>
      <text x="236" y="63" class="font-mono" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">▶ ACTIVE NOW</text>
      <text x="1390" y="68" class="font-mono" font-size="22" font-weight="700" fill="#38bdf8" text-anchor="end">NOV 23 (7 DAYS LEFT)</text>
      <text x="146" y="126" class="font-sans" font-size="36" font-weight="800" fill="#ffffff">20 Tailored Applications &amp; Portfolio V1 Shipped</text>
      <text x="146" y="168" class="font-sans" font-size="24" font-weight="400" fill="#cbd5e1">Submit through Handshake, outreach to 5 alumni for referrals, verify mobile responsiveness</text>
    </g>

    <!-- Milestone 3: Upcoming -->
    <g transform="translate(70, 640)">
      <rect width="1460" height="190" rx="28" fill="#0f172a" fill-opacity="0.5" stroke="url(#d_cardBorder)" stroke-width="1.5"/>
      <circle cx="80" cy="95" r="30" fill="#0b1120" stroke="#475569" stroke-width="3"/>
      <circle cx="80" cy="95" r="8" fill="#64748b"/>
      <text x="146" y="68" class="font-mono" font-size="22" font-weight="600" fill="#64748b" letter-spacing="1.5">M-14 • UPCOMING</text>
      <text x="1390" y="68" class="font-mono" font-size="22" font-weight="500" fill="#64748b" text-anchor="end">NOV 30</text>
      <text x="146" y="116" class="font-sans" font-size="34" font-weight="600" fill="#cbd5e1">Technical Coding &amp; Behavioral Mocks</text>
      <text x="146" y="154" class="font-sans" font-size="24" font-weight="400" fill="#64748b">10 LeetCode Mediums mastered, STAR framework practiced with mentor for top 8 stories</text>
    </g>

    <!-- Milestone 4: Upcoming -->
    <g transform="translate(70, 860)">
      <rect width="1460" height="190" rx="28" fill="#0f172a" fill-opacity="0.5" stroke="url(#d_cardBorder)" stroke-width="1.5"/>
      <circle cx="80" cy="95" r="30" fill="#0b1120" stroke="#475569" stroke-width="3"/>
      <circle cx="80" cy="95" r="8" fill="#64748b"/>
      <text x="146" y="68" class="font-mono" font-size="22" font-weight="600" fill="#64748b" letter-spacing="1.5">M-07 • UPCOMING</text>
      <text x="1390" y="68" class="font-mono" font-size="22" font-weight="500" fill="#64748b" text-anchor="end">DEC 07</text>
      <text x="146" y="116" class="font-sans" font-size="34" font-weight="600" fill="#cbd5e1">Final Round Onsite Interviews</text>
      <text x="146" y="154" class="font-sans" font-size="24" font-weight="400" fill="#64748b">System architecture deep dive, culture fit rounds, personalized follow-ups dispatched</text>
    </g>

    <!-- Milestone 5: Goal -->
    <g transform="translate(70, 1080)">
      <rect width="1460" height="190" rx="28" fill="#0f172a" fill-opacity="0.7" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2"/>
      <circle cx="80" cy="95" r="34" fill="#451a03" stroke="#f59e0b" stroke-width="3"/>
      <polygon points="80,75 85,88 98,89 88,98 91,111 80,103 69,111 72,98 62,89 75,88" fill="#fbbf24"/>
      <text x="146" y="68" class="font-mono" font-size="22" font-weight="700" fill="#fbbf24" letter-spacing="1.5">M-00 • VICTORY GOAL</text>
      <text x="1390" y="68" class="font-mono" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="end">DEC 16</text>
      <text x="146" y="116" class="font-sans" font-size="34" font-weight="700" fill="#ffffff">Offer Letter Negotiated &amp; Signed</text>
      <text x="146" y="154" class="font-sans" font-size="24" font-weight="400" fill="#94a3b8">Market compensation benchmarked, start date aligned, graduation celebration!</text>
    </g>
  </g>
</svg>
